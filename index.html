<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eva Lyneborg — Logo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --panel-bg: #1a1a1a;
    --panel-fg: #e8e8e8;
    --panel-muted: #888;
    --panel-border: #333;
    --accent: #6c9ce8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #0e0e0e;
    color: var(--panel-fg);
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }

  /* ---- Control panel ---- */
  .panel {
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-border);
    padding: 24px 22px;
    overflow-y: auto;
  }
  .panel h1 {
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .panel .sub {
    color: var(--panel-muted);
    font-size: 12px;
    margin: 0 0 28px;
  }
  .control { margin-bottom: 26px; }
  .section-label,
  .control > label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--panel-muted);
    margin-bottom: 8px;
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type="color"] {
    width: 44px; height: 44px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .color-row .hex {
    font-family: ui-monospace, "Cascadia Code", monospace;
    font-size: 13px;
    color: var(--panel-fg);
    background: #111;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    flex: 1;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .slider-head {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .slider-head .val {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: var(--panel-fg);
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 12px; color: var(--panel-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .checkbox-row label { cursor: pointer; }

  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions button, .add-line, .setup-row button {
    background: #262626;
    color: var(--panel-fg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .actions button { flex: 1; }
  .actions button:hover, .add-line:hover, .setup-row button:hover {
    background: #303030; border-color: #444;
  }
  .add-line { width: 100%; margin-top: 4px; }

  /* ---- Saved setups ---- */
  .setup-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .setup-row select, .setup-row input {
    flex: 1; min-width: 0;
    background: #111; border: 1px solid var(--panel-border);
    border-radius: 6px; color: var(--panel-fg);
    font-size: 13px; padding: 8px 10px;
  }
  .setup-row button { white-space: nowrap; }

  /* ---- Text lines ---- */
  .text-row {
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #161616;
  }
  .text-row .tl-text {
    width: 100%;
    background: #111;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--panel-fg);
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .text-row .size-line {
    display: flex; align-items: center; gap: 8px;
  }
  .text-row .size-line .cap {
    font-size: 11px; color: var(--panel-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .text-row .size-line .tl-size { flex: 1; }
  .text-row .size-line .tl-size-val {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--panel-fg); width: 30px; text-align: right;
  }
  .text-row .tl-del {
    background: none; border: none; color: var(--panel-muted);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px;
  }
  .text-row .tl-del:hover { color: #e06c6c; }

  /* ---- Preview stage ---- */
  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px;
  }
  .frame {
    width: min(70vmin, 560px);
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .frame svg { width: 100%; height: auto; display: block; }
  .loading { color: var(--panel-muted); font-size: 14px; padding: 40px; display:block; }
</style>
</head>
<body>
  <aside class="panel">
    <h1>Logo Studio</h1>
    <p class="sub">Eva Lyneborg</p>

    <div class="control">
      <span class="section-label">Saved setups</span>
      <div class="setup-row">
        <select id="setupSelect"><option value="">— last session —</option></select>
        <button id="loadSetup">Load</button>
        <button id="deleteSetup">Del</button>
      </div>
      <div class="setup-row">
        <input id="setupName" placeholder="New setup name" spellcheck="false" />
        <button id="saveSetup">Save</button>
      </div>
    </div>

    <div class="control">
      <label for="fillColor">Fill (artwork &amp; text)</label>
      <div class="color-row">
        <input type="color" id="fillColor" value="#eaead2" />
        <input type="text" class="hex" id="fillHex" value="#eaead2" spellcheck="false" />
      </div>
    </div>

    <div class="control">
      <label for="bgColor">Background</label>
      <div class="color-row">
        <input type="color" id="bgColor" value="#000000" />
        <input type="text" class="hex" id="bgHex" value="#000000" spellcheck="false" />
      </div>
    </div>

    <div class="control">
      <div class="slider-head">
        <label for="heightRegulator" style="margin:0">Height regulator</label>
        <span class="val" id="heightRegulatorVal">0</span>
      </div>
      <input type="range" id="heightRegulator" min="-125" max="109" value="0" />
    </div>

    <div class="control">
      <div class="slider-head">
        <label for="weight" style="margin:0">Font weight</label>
        <span class="val" id="weightVal">Medium</span>
      </div>
      <input type="range" id="weight" min="400" max="700" step="100" value="500" />
    </div>

    <div class="control">
      <div class="slider-head">
        <label for="lineSpacing" style="margin:0">Line spacing</label>
        <span class="val" id="lineSpacingVal">30</span>
      </div>
      <input type="range" id="lineSpacing" min="0" max="140" step="1" value="30" />
    </div>

    <div class="control">
      <span class="section-label">Text lines (fill logo width)</span>
      <div id="textLines"></div>
      <button class="add-line" id="addLine">+ Add line</button>
      <div class="checkbox-row">
        <input type="checkbox" id="freeSize" />
        <label for="freeSize">Free size (step 1, otherwise 10)</label>
      </div>
    </div>

    <div class="control">
      <div class="actions">
        <button id="swap">Swap colors</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </aside>

  <main class="stage">
    <div class="frame" id="frame">
      <span class="loading">Loading logo…</span>
    </div>
  </main>

<script>
  const SVGNS = "http://www.w3.org/2000/svg";

  // Full default state. Saving/loading serializes this WHOLE object, so any
  // future setting added here is automatically persisted and restored.
  const DEFAULTS = {
    fill: "#eaead2",
    bg: "#000000",
    heightRegulator: 0,
    weight: 500,
    lineSpacing: 30,
    freeSize: false,
    textLines: [ { text: "EVA LYNEBORG", size: 70 } ],
  };
  // Settings restored by "Reset" (everything visual except the text content).
  const RESET_KEYS = ["fill", "bg", "heightRegulator", "weight", "lineSpacing"];

  let state = structuredClone(DEFAULTS);

  const WEIGHT_NAMES = { 400: "Regular", 500: "Medium", 600: "SemiBold", 700: "Bold" };

  // --- Geometry / layout constants (in the logo's SVG coordinate units) ---
  const TOP_THRESHOLD = 35;   // frame-top Y values below this belong to the top bar
  const CAP_RATIO     = 0.72; // all-caps visual height as a fraction of font-size (Outfit)
  const TEXT_TOP_GAP  = 48;   // gap from frame bottom to the first text line
  const BOTTOM_PAD    = 36;   // padding below the last line

  const els = {
    frame:    document.getElementById("frame"),
    fillColor:document.getElementById("fillColor"),
    fillHex:  document.getElementById("fillHex"),
    bgColor:  document.getElementById("bgColor"),
    bgHex:    document.getElementById("bgHex"),
    heightRegulator:    document.getElementById("heightRegulator"),
    heightRegulatorVal: document.getElementById("heightRegulatorVal"),
    weight:    document.getElementById("weight"),
    weightVal: document.getElementById("weightVal"),
    lineSpacing:    document.getElementById("lineSpacing"),
    lineSpacingVal: document.getElementById("lineSpacingVal"),
    freeSize: document.getElementById("freeSize"),
    textLines: document.getElementById("textLines"),
    addLine:  document.getElementById("addLine"),
    swap:     document.getElementById("swap"),
    reset:    document.getElementById("reset"),
    setupSelect: document.getElementById("setupSelect"),
    setupName:   document.getElementById("setupName"),
    saveSetup:   document.getElementById("saveSetup"),
    loadSetup:   document.getElementById("loadSetup"),
    deleteSetup: document.getElementById("deleteSetup"),
  };

  let svgEl = null, framePath = null, frameOrigD = "";
  let baseViewBox = null, bgRect = null, textGroup = null, frameMetrics = null;

  /* =========================================================================
     LOCAL STORAGE  (last session + named setups)
     The whole `state` object is stored as JSON, so adding new settings later
     needs no storage changes — they ride along automatically.
     ========================================================================= */
  const LS_KEY = "evalyneborg_logostudio_v1";

  function loadDB() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
    catch { return {}; }
  }
  function saveDB(db) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { console.warn(e); }
  }
  // Autosave the working state as "last session".
  function persistLast() {
    const db = loadDB();
    db.last = structuredClone(state);
    saveDB(db);
  }
  // Merge a stored object onto a fresh default, so missing/older keys keep a
  // sane default (forward- and backward-compatible).
  function adoptState(obj) {
    const next = structuredClone(DEFAULTS);
    if (obj && typeof obj === "object") {
      for (const k of Object.keys(obj)) next[k] = structuredClone(obj[k]);
    }
    if (!Array.isArray(next.textLines) || next.textLines.length === 0) {
      next.textLines = structuredClone(DEFAULTS.textLines);
    }
    state = next;
  }

  function refreshSetupList(selectedName = "") {
    const db = loadDB();
    const setups = db.setups || {};
    const names = Object.keys(setups).sort((a, b) => a.localeCompare(b));
    els.setupSelect.innerHTML =
      '<option value="">— last session —</option>' +
      names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join("");
    els.setupSelect.value = selectedName;
  }
  function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
  function escapeAttr(s){return escapeHtml(s).replace(/"/g,"&quot;");}

  /* =========================================================================
     SVG LOAD + RENDER
     ========================================================================= */
  // Shift the Y of every coordinate on the top bar by `dy`.
  function shiftFrameTop(d, dy) {
    let i = 0;
    return d.replace(/-?\d*\.?\d+/g, (m) => {
      const isY = (i++ % 2) === 1;
      if (isY) {
        const v = parseFloat(m);
        if (v < TOP_THRESHOLD) return (v + dy).toString();
      }
      return m;
    });
  }

  fetch("LOGO.svg")
    .then(r => r.text())
    .then(text => {
      els.frame.innerHTML = text;
      svgEl = els.frame.querySelector("svg");
      svgEl.removeAttribute("width");
      svgEl.removeAttribute("height");

      framePath  = svgEl.querySelector("path");
      frameOrigD = framePath ? framePath.getAttribute("d") : "";

      const vb = svgEl.getAttribute("viewBox").split(/[\s,]+/).map(Number);
      baseViewBox = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };

      const fb = framePath.getBBox();
      frameMetrics = { left: fb.x, width: fb.width, bottom: fb.y + fb.height };

      bgRect = document.createElementNS(SVGNS, "rect");
      svgEl.insertBefore(bgRect, svgEl.firstChild);

      textGroup = document.createElementNS(SVGNS, "g");
      svgEl.appendChild(textGroup);

      // Restore last session if present.
      const db = loadDB();
      if (db.last) adoptState(db.last);
      refreshSetupList();
      syncUIFromState();
      rebuildTextRows();
      render();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(render);
      }
    })
    .catch(err => {
      els.frame.innerHTML =
        '<span class="loading">Could not load LOGO.svg — serve this page over http.</span>';
      console.error(err);
    });

  // Build the text lines into the SVG; returns the Y of the last ink bottom.
  function layoutText() {
    while (textGroup.firstChild) textGroup.removeChild(textGroup.firstChild);

    let prevInkBottom = frameMetrics.bottom;
    const frameRight = frameMetrics.left + frameMetrics.width;

    state.textLines.forEach((line, i) => {
      const size = line.size;
      const content = (line.text || "").toUpperCase();
      const gap = (i === 0) ? TEXT_TOP_GAP : state.lineSpacing;
      const targetInkTop = prevInkBottom + gap;

      if (!content.length) {
        prevInkBottom = targetInkTop + size * CAP_RATIO;
        return;
      }

      const t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", frameMetrics.left);
      t.setAttribute("y", targetInkTop);
      t.setAttribute("textLength", frameMetrics.width);
      t.setAttribute("lengthAdjust", "spacing");
      t.setAttribute("font-family", "Outfit, Arial, sans-serif");
      t.setAttribute("font-weight", state.weight);
      t.setAttribute("font-size", size);
      t.setAttribute("dominant-baseline", "hanging");
      t.setAttribute("fill", state.fill);
      t.textContent = content;
      textGroup.appendChild(t);

      // Vertical: land the ink TOP exactly on targetInkTop (equal gaps).
      let b = t.getBBox();
      const yShift = targetInkTop - b.y;
      t.setAttribute("y", targetInkTop + yShift);

      // Horizontal: make visible ink span the frame width exactly.
      b = t.getBBox();
      const leftBearing  = b.x - frameMetrics.left;
      const rightBearing = frameRight - (b.x + b.width);
      t.setAttribute("x", frameMetrics.left - leftBearing);
      t.setAttribute("textLength", frameMetrics.width + leftBearing + rightBearing);

      prevInkBottom = targetInkTop + b.height;
    });

    return prevInkBottom;
  }

  function render() {
    if (!svgEl) return;

    svgEl.querySelectorAll("g, path").forEach(node => {
      if (node.getAttribute("fill") !== null || node.tagName === "path") {
        node.setAttribute("fill", state.fill);
      }
    });

    if (framePath) {
      framePath.setAttribute("d", shiftFrameTop(frameOrigD, state.heightRegulator));
    }

    const textBottom = layoutText();

    const barTop = 11 + state.heightRegulator;
    const minY = Math.min(baseViewBox.y, barTop - 15);
    const baseBottom = baseViewBox.y + baseViewBox.h;
    const maxY = Math.max(baseBottom, textBottom + BOTTOM_PAD);
    svgEl.setAttribute("viewBox",
      `${baseViewBox.x} ${minY} ${baseViewBox.w} ${maxY - minY}`);

    bgRect.setAttribute("x", baseViewBox.x);
    bgRect.setAttribute("y", minY);
    bgRect.setAttribute("width", baseViewBox.w);
    bgRect.setAttribute("height", maxY - minY);
    bgRect.setAttribute("fill", state.bg);

    els.frame.style.background = state.bg;

    persistLast();
  }

  /* =========================================================================
     UI SYNC
     ========================================================================= */
  function syncUIFromState() {
    els.fillColor.value = state.fill; els.fillHex.value = state.fill;
    els.bgColor.value = state.bg;     els.bgHex.value = state.bg;
    els.heightRegulator.value = state.heightRegulator;
    els.heightRegulatorVal.textContent =
      (state.heightRegulator > 0 ? "+" : "") + state.heightRegulator;
    els.weight.value = state.weight;
    els.weightVal.textContent = WEIGHT_NAMES[state.weight] || state.weight;
    els.lineSpacing.value = state.lineSpacing;
    els.lineSpacingVal.textContent = state.lineSpacing;
    els.freeSize.checked = !!state.freeSize;
  }

  // Text-line UI (rebuilt only on add/delete/load so typing keeps focus).
  function rebuildTextRows() {
    els.textLines.innerHTML = "";
    const step = state.freeSize ? 1 : 10;

    state.textLines.forEach((line, idx) => {
      const row = document.createElement("div");
      row.className = "text-row";

      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.className = "tl-text";
      textInput.value = line.text;
      textInput.placeholder = "LINE TEXT";
      textInput.spellcheck = false;
      textInput.addEventListener("input", e => {
        state.textLines[idx].text = e.target.value;
        render();
      });

      const sizeLine = document.createElement("div");
      sizeLine.className = "size-line";

      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = "Size";

      const sizeInput = document.createElement("input");
      sizeInput.type = "range";
      sizeInput.className = "tl-size";
      sizeInput.min = "20"; sizeInput.max = "200"; sizeInput.step = String(step);
      sizeInput.value = line.size;

      const sizeVal = document.createElement("span");
      sizeVal.className = "tl-size-val";
      sizeVal.textContent = line.size;

      sizeInput.addEventListener("input", e => {
        const v = Number(e.target.value);
        state.textLines[idx].size = v;
        sizeVal.textContent = v;
        render();
      });

      const del = document.createElement("button");
      del.className = "tl-del";
      del.title = "Delete line";
      del.textContent = "×";
      del.addEventListener("click", () => {
        state.textLines.splice(idx, 1);
        if (state.textLines.length === 0) state.textLines.push({ text: "", size: 60 });
        rebuildTextRows();
        render();
      });

      sizeLine.append(cap, sizeInput, sizeVal, del);
      row.append(textInput, sizeLine);
      els.textLines.appendChild(row);
    });
  }

  function normalizeHex(v) {
    v = v.trim();
    if (!v.startsWith("#")) v = "#" + v;
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : null;
  }

  /* =========================================================================
     EVENT WIRING
     ========================================================================= */
  els.fillColor.addEventListener("input", e => {
    state.fill = e.target.value; els.fillHex.value = state.fill; render();
  });
  els.fillHex.addEventListener("change", e => {
    const hex = normalizeHex(e.target.value);
    if (hex) { state.fill = hex; els.fillColor.value = hex; els.fillHex.value = hex; render(); }
    else { els.fillHex.value = state.fill; }
  });

  els.bgColor.addEventListener("input", e => {
    state.bg = e.target.value; els.bgHex.value = state.bg; render();
  });
  els.bgHex.addEventListener("change", e => {
    const hex = normalizeHex(e.target.value);
    if (hex) { state.bg = hex; els.bgColor.value = hex; els.bgHex.value = hex; render(); }
    else { els.bgHex.value = state.bg; }
  });

  els.heightRegulator.addEventListener("input", e => {
    state.heightRegulator = Number(e.target.value);
    els.heightRegulatorVal.textContent =
      (state.heightRegulator > 0 ? "+" : "") + state.heightRegulator;
    render();
  });

  els.weight.addEventListener("input", e => {
    state.weight = Number(e.target.value);
    els.weightVal.textContent = WEIGHT_NAMES[state.weight] || state.weight;
    render();
  });

  els.lineSpacing.addEventListener("input", e => {
    state.lineSpacing = Number(e.target.value);
    els.lineSpacingVal.textContent = state.lineSpacing;
    render();
  });

  els.freeSize.addEventListener("change", e => {
    state.freeSize = e.target.checked;
    rebuildTextRows();   // updates each size slider's step
    render();
  });

  els.addLine.addEventListener("click", () => {
    state.textLines.push({ text: "", size: 60 });
    rebuildTextRows();
    render();
  });

  els.swap.addEventListener("click", () => {
    [state.fill, state.bg] = [state.bg, state.fill];
    els.fillColor.value = state.fill; els.fillHex.value = state.fill;
    els.bgColor.value = state.bg;     els.bgHex.value = state.bg;
    render();
  });

  els.reset.addEventListener("click", () => {
    for (const k of RESET_KEYS) state[k] = structuredClone(DEFAULTS[k]);
    syncUIFromState();
    rebuildTextRows();
    render();
  });

  // ---- Saved setups ----
  els.saveSetup.addEventListener("click", () => {
    const name = els.setupName.value.trim();
    if (!name) { els.setupName.focus(); return; }
    const db = loadDB();
    db.setups = db.setups || {};
    db.setups[name] = structuredClone(state);
    saveDB(db);
    els.setupName.value = "";
    refreshSetupList(name);
  });

  els.loadSetup.addEventListener("click", () => {
    const name = els.setupSelect.value;
    const db = loadDB();
    if (name && db.setups && db.setups[name]) {
      adoptState(db.setups[name]);
    } else if (db.last) {
      adoptState(db.last);
    }
    syncUIFromState();
    rebuildTextRows();
    render();
  });

  els.deleteSetup.addEventListener("click", () => {
    const name = els.setupSelect.value;
    if (!name) return;
    const db = loadDB();
    if (db.setups && db.setups[name]) {
      delete db.setups[name];
      saveDB(db);
      refreshSetupList();
    }
  });
</script>
</body>
</html>
