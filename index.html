<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eva Lyneborg — Logo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --panel-bg: #1a1a1a;
    --panel-fg: #e8e8e8;
    --panel-muted: #888;
    --panel-border: #333;
    --accent: #6c9ce8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #0e0e0e;
    color: var(--panel-fg);
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }

  /* ---- Control panel ---- */
  .panel {
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-border);
    padding: 24px 22px;
    overflow-y: auto;
  }
  .panel h1 {
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .panel .sub {
    color: var(--panel-muted);
    font-size: 12px;
    margin: 0 0 28px;
  }
  .control { margin-bottom: 26px; }
  .section-label,
  .control > label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--panel-muted);
    margin-bottom: 8px;
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type="color"] {
    width: 44px; height: 44px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .color-row .hex {
    font-family: ui-monospace, "Cascadia Code", monospace;
    font-size: 13px;
    color: var(--panel-fg);
    background: #111;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    flex: 1;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .slider-head {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .slider-head .val {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: var(--panel-fg);
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 12px; color: var(--panel-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .checkbox-row label { cursor: pointer; }

  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions button, .add-line, .setup-row button {
    background: #262626;
    color: var(--panel-fg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .actions button { flex: 1; }
  .actions button:hover, .add-line:hover, .setup-row button:hover {
    background: #303030; border-color: #444;
  }
  .add-line { width: 100%; margin-top: 4px; }

  /* ---- Saved setups ---- */
  .setup-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .setup-row select, .setup-row input {
    flex: 1; min-width: 0;
    background: #111; border: 1px solid var(--panel-border);
    border-radius: 6px; color: var(--panel-fg);
    font-size: 13px; padding: 8px 10px;
  }
  .setup-row button { white-space: nowrap; }

  /* ---- Collapsible pane (general settings) ---- */
  .pane {
    margin-bottom: 24px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px; background: #1f1f1f; cursor: pointer; user-select: none;
  }
  .pane-head .section-label { margin: 0; }
  .pane-head .chev { color: var(--panel-muted); font-size: 11px; transition: transform 0.12s ease; }
  .pane.collapsed .chev { transform: rotate(-90deg); }
  .pane-body { padding: 16px 12px 0; }
  .pane.collapsed .pane-body { display: none; }
  .pane-body .control:last-child { margin-bottom: 16px; }

  /* ---- Text lines ---- */
  .text-row {
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    margin-bottom: 10px;
    background: #161616;
    overflow: hidden;
  }
  .text-row.dragging { opacity: 0.45; }
  .text-row.drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
  .text-row.drop-after  { box-shadow: 0  3px 0 0 var(--accent); }

  /* row header (always visible): handle • title • collapse • delete */
  .tl-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    background: #1f1f1f;
    border-bottom: 1px solid var(--panel-border);
    user-select: none;
  }
  .text-row.collapsed .tl-head { border-bottom: none; }
  .tl-handle {
    cursor: grab; color: var(--panel-muted); font-size: 14px;
    line-height: 1; letter-spacing: -1px;
  }
  .tl-handle:active { cursor: grabbing; }
  .tl-kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent); border: 1px solid #2c3b54; background: #16202e;
    border-radius: 4px; padding: 2px 6px; white-space: nowrap;
  }
  .tl-kind.is-line { color: #c9a96a; border-color: #4a3f28; background: #241f14; }
  .tl-title {
    flex: 1; min-width: 0; font-size: 12px; color: var(--panel-fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tl-title.empty { color: var(--panel-muted); font-style: italic; text-transform: none; letter-spacing: 0; }
  .tl-collapse {
    background: none; border: none; color: var(--panel-muted);
    cursor: pointer; font-size: 11px; padding: 2px 4px; line-height: 1;
    transition: transform 0.12s ease;
  }
  .text-row.collapsed .tl-collapse { transform: rotate(-90deg); }
  .tl-body { padding: 10px; }
  .text-row.collapsed .tl-body { display: none; }

  .text-row .tl-text {
    width: 100%;
    background: #111;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--panel-fg);
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .text-row .size-line {
    display: flex; align-items: center; gap: 8px;
  }
  .text-row .size-line .cap {
    font-size: 11px; color: var(--panel-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .text-row .size-line .tl-size { flex: 1; }
  .text-row .size-line .tl-size-val {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--panel-fg); width: 30px; text-align: right;
  }
  .text-row .tl-del {
    background: none; border: none; color: var(--panel-muted);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px;
  }
  .text-row .tl-del:hover { color: #e06c6c; }

  /* ---- Preview stage ---- */
  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px;
  }
  .frame {
    width: min(70vmin, 560px);
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .frame svg { width: 100%; height: auto; display: block; }
  .loading { color: var(--panel-muted); font-size: 14px; padding: 40px; display:block; }
</style>
</head>
<body>
  <aside class="panel">
    <h1>Logo Studio</h1>
    <p class="sub">Eva Lyneborg</p>

    <div class="control">
      <span class="section-label">Saved setups</span>
      <div class="setup-row">
        <select id="setupSelect"><option value="">— last session —</option></select>
        <button id="loadSetup">Load</button>
        <button id="deleteSetup">Del</button>
      </div>
      <div class="setup-row">
        <input id="setupName" placeholder="New setup name" spellcheck="false" />
        <button id="saveSetup">Save</button>
      </div>
    </div>

    <div class="pane" id="generalPane">
      <div class="pane-head" id="generalPaneHead">
        <span class="section-label">General settings</span>
        <span class="chev">▼</span>
      </div>
      <div class="pane-body">
        <div class="control">
          <label for="fillColor">Fill (artwork &amp; text)</label>
          <div class="color-row">
            <input type="color" id="fillColor" value="#eaead2" />
            <input type="text" class="hex" id="fillHex" value="#eaead2" spellcheck="false" />
          </div>
        </div>

        <div class="control">
          <label for="bgColor">Background</label>
          <div class="color-row">
            <input type="color" id="bgColor" value="#000000" />
            <input type="text" class="hex" id="bgHex" value="#000000" spellcheck="false" />
          </div>
        </div>

        <div class="control">
          <span class="section-label">Text placement</span>
          <div class="setup-row">
            <select id="mode">
              <option value="below">Below — text under logo (tall)</option>
              <option value="side">Side — text right of logo (wide)</option>
            </select>
          </div>
        </div>

        <div class="control">
          <div class="slider-head">
            <label for="heightRegulator" style="margin:0">Height regulator</label>
            <span class="val" id="heightRegulatorVal">0</span>
          </div>
          <input type="range" id="heightRegulator" min="-125" max="109" value="0" />
        </div>

        <div class="control">
          <div class="slider-head">
            <label for="textGap" style="margin:0">Logo–text gap</label>
            <span class="val" id="textGapVal">48</span>
          </div>
          <input type="range" id="textGap" min="0" max="240" value="48" />
        </div>

        <div class="control">
          <div class="slider-head">
            <label for="lineSpacing" style="margin:0">Line spacing</label>
            <span class="val" id="lineSpacingVal">30</span>
          </div>
          <input type="range" id="lineSpacing" min="0" max="140" step="1" value="30" />
        </div>

        <div class="control">
          <div class="slider-head">
            <label for="outerMargin" style="margin:0">Outer frame</label>
            <span class="val" id="outerMarginVal">0</span>
          </div>
          <input type="range" id="outerMargin" min="0" max="300" value="0" />
        </div>
      </div>
    </div>

    <div class="control">
      <span class="section-label">Text lines (fill logo width)</span>
      <div id="textLines"></div>
      <div class="actions" style="margin-top:4px">
        <button class="add-line" id="addLine" style="margin-top:0">+ Add text</button>
        <button class="add-line" id="addRule" style="margin-top:0">+ Add line</button>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="freeSize" />
        <label for="freeSize">Free size (step 1, otherwise 10)</label>
      </div>
    </div>

    <div class="control">
      <div class="actions">
        <button id="swap">Swap colors</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </aside>

  <main class="stage">
    <div class="frame" id="frame">
      <span class="loading">Loading logo…</span>
    </div>
  </main>

<script>
  const SVGNS = "http://www.w3.org/2000/svg";

  // Full default state. Saving/loading serializes this WHOLE object, so any
  // future setting added here is automatically persisted and restored.
  const DEFAULTS = {
    fill: "#eaead2",
    bg: "#000000",
    mode: "below",          // "below" = text under logo, "side" = text to the right
    heightRegulator: 0,
    weight: 500,            // default weight applied to newly added text lines
    lineSpacing: 30,
    textGap: 48,            // gap between the logo and the text block
    outerMargin: 0,         // extra background frame around the whole composition
    freeSize: false,
    generalCollapsed: false,// UI: is the "General settings" pane folded?
    // Each item is either:
    //   { type:"text", text, size, weight }              a text line
    //   { type:"line", thickness }                       a horizontal rule
    // thickness === null means "use the frame thickness".
    textLines: [ { type: "text", text: "EVA LYNEBORG", size: 70, weight: 500 } ],
  };
  // Settings restored by "Reset" (everything visual except the text content).
  const RESET_KEYS = ["fill", "bg", "heightRegulator", "weight", "lineSpacing", "textGap", "outerMargin"];

  let state = structuredClone(DEFAULTS);

  const WEIGHT_NAMES = {
    100: "Thin", 200: "ExtraLight", 300: "Light", 400: "Regular", 500: "Medium",
    600: "SemiBold", 700: "Bold", 800: "ExtraBold", 900: "Black",
  };

  // --- Geometry / layout constants (in the logo's SVG coordinate units) ---
  const TOP_THRESHOLD = 35;   // frame-top Y values below this belong to the top bar
  const CAP_RATIO     = 0.72; // all-caps visual height as a fraction of font-size (Outfit)
  const BOTTOM_PAD    = 36;   // padding below the last line (below mode)
  const SIDE_PAD      = 36;   // padding right of the text column (side mode)
  // (the logo↔text gap is user-controlled via state.textGap)

  const els = {
    frame:    document.getElementById("frame"),
    fillColor:document.getElementById("fillColor"),
    fillHex:  document.getElementById("fillHex"),
    bgColor:  document.getElementById("bgColor"),
    bgHex:    document.getElementById("bgHex"),
    mode:     document.getElementById("mode"),
    heightRegulator:    document.getElementById("heightRegulator"),
    heightRegulatorVal: document.getElementById("heightRegulatorVal"),
    textGap:    document.getElementById("textGap"),
    textGapVal: document.getElementById("textGapVal"),
    lineSpacing:    document.getElementById("lineSpacing"),
    lineSpacingVal: document.getElementById("lineSpacingVal"),
    outerMargin:    document.getElementById("outerMargin"),
    outerMarginVal: document.getElementById("outerMarginVal"),
    generalPane:     document.getElementById("generalPane"),
    generalPaneHead: document.getElementById("generalPaneHead"),
    freeSize: document.getElementById("freeSize"),
    textLines: document.getElementById("textLines"),
    addLine:  document.getElementById("addLine"),
    addRule:  document.getElementById("addRule"),
    swap:     document.getElementById("swap"),
    reset:    document.getElementById("reset"),
    setupSelect: document.getElementById("setupSelect"),
    setupName:   document.getElementById("setupName"),
    saveSetup:   document.getElementById("saveSetup"),
    loadSetup:   document.getElementById("loadSetup"),
    deleteSetup: document.getElementById("deleteSetup"),
  };

  let svgEl = null, framePath = null, frameOrigD = "";
  let baseViewBox = null, bgRect = null, textGroup = null, frameMetrics = null;

  /* =========================================================================
     LOCAL STORAGE  (last session + named setups)
     The whole `state` object is stored as JSON, so adding new settings later
     needs no storage changes — they ride along automatically.
     ========================================================================= */
  const LS_KEY = "evalyneborg_logostudio_v1";

  function loadDB() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
    catch { return {}; }
  }
  function saveDB(db) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { console.warn(e); }
  }
  // Autosave the working state as "last session".
  function persistLast() {
    const db = loadDB();
    db.last = structuredClone(state);
    saveDB(db);
  }
  // Merge a stored object onto a fresh default, so missing/older keys keep a
  // sane default (forward- and backward-compatible).
  function adoptState(obj) {
    const next = structuredClone(DEFAULTS);
    if (obj && typeof obj === "object") {
      for (const k of Object.keys(obj)) next[k] = structuredClone(obj[k]);
    }
    if (!Array.isArray(next.textLines) || next.textLines.length === 0) {
      next.textLines = structuredClone(DEFAULTS.textLines);
    }
    // Normalize items (older saves may lack `type`, `weight`, or `thickness`).
    next.textLines = next.textLines.map(l =>
      l && l.type === "line"
        ? { type: "line",
            thickness: (typeof l.thickness === "number") ? l.thickness : null,
            collapsed: !!(l && l.collapsed) }
        : { type: "text",
            text: (l && l.text) || "",
            size: (l && l.size) || 60,
            weight: (l && l.weight) || next.weight || 500,
            collapsed: !!(l && l.collapsed) }
    );
    state = next;
  }

  function refreshSetupList(selectedName = "") {
    const db = loadDB();
    const setups = db.setups || {};
    const names = Object.keys(setups).sort((a, b) => a.localeCompare(b));
    els.setupSelect.innerHTML =
      '<option value="">— last session —</option>' +
      names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join("");
    els.setupSelect.value = selectedName;
  }
  function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
  function escapeAttr(s){return escapeHtml(s).replace(/"/g,"&quot;");}

  /* =========================================================================
     SVG LOAD + RENDER
     ========================================================================= */
  // Shift the Y of every coordinate on the top bar by `dy`.
  function shiftFrameTop(d, dy) {
    let i = 0;
    return d.replace(/-?\d*\.?\d+/g, (m) => {
      const isY = (i++ % 2) === 1;
      if (isY) {
        const v = parseFloat(m);
        if (v < TOP_THRESHOLD) return (v + dy).toString();
      }
      return m;
    });
  }

  fetch("LOGO.svg")
    .then(r => r.text())
    .then(text => {
      els.frame.innerHTML = text;
      svgEl = els.frame.querySelector("svg");
      svgEl.removeAttribute("width");
      svgEl.removeAttribute("height");

      framePath  = svgEl.querySelector("path");
      frameOrigD = framePath ? framePath.getAttribute("d") : "";

      const vb = svgEl.getAttribute("viewBox").split(/[\s,]+/).map(Number);
      baseViewBox = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };

      const fb = framePath.getBBox();
      // Frame border thickness = inner-left edge − outer-left edge. Measured
      // from the path so an "Add line" rule always matches the frame exactly.
      const xs = frameOrigD.match(/-?\d*\.?\d+/g).map(Number).filter((_, i) => i % 2 === 0);
      const outerLeft = Math.min(...xs);
      const innerLeft = Math.min(...xs.filter(x => x > outerLeft + 2));
      frameMetrics = {
        left: fb.x, width: fb.width, bottom: fb.y + fb.height,
        thickness: innerLeft - outerLeft,
      };

      bgRect = document.createElementNS(SVGNS, "rect");
      svgEl.insertBefore(bgRect, svgEl.firstChild);

      textGroup = document.createElementNS(SVGNS, "g");
      svgEl.appendChild(textGroup);

      // Restore last session if present.
      const db = loadDB();
      if (db.last) adoptState(db.last);
      refreshSetupList();
      syncUIFromState();
      rebuildTextRows();
      render();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(render);
      }
    })
    .catch(err => {
      els.frame.innerHTML =
        '<span class="loading">Could not load LOGO.svg — serve this page over http.</span>';
      console.error(err);
    });

  // Lay the text/line items into a column [left, left+width], with the first
  // item's ink top starting at `startTop` and equal `lineSpacing` between
  // items. Each text line's ink is stretched to span the column width exactly.
  // `scale` multiplies sizes, thicknesses and gaps (used by side mode to make
  // the whole text block exactly as tall as the logo). Returns the last ink
  // bottom Y.
  function layoutText(left, width, startTop, scale = 1) {
    while (textGroup.firstChild) textGroup.removeChild(textGroup.firstChild);

    const right = left + width;
    const gapBetween = state.lineSpacing * scale;
    let prevInkBottom = startTop;

    state.textLines.forEach((line, i) => {
      const targetInkTop = (i === 0) ? startTop : prevInkBottom + gapBetween;

      // Horizontal rule — adjustable thickness (defaults to frame thickness).
      if (line.type === "line") {
        const base = (line.thickness == null) ? frameMetrics.thickness : line.thickness;
        const th = base * scale;
        const r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", left);
        r.setAttribute("y", targetInkTop);
        r.setAttribute("width", width);
        r.setAttribute("height", th);
        r.setAttribute("fill", state.fill);
        textGroup.appendChild(r);
        prevInkBottom = targetInkTop + th;
        return;
      }

      const size = line.size * scale;
      const content = (line.text || "").toUpperCase();

      if (!content.length) {
        prevInkBottom = targetInkTop + size * CAP_RATIO;
        return;
      }

      const t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", left);
      t.setAttribute("y", targetInkTop);
      t.setAttribute("textLength", width);
      t.setAttribute("lengthAdjust", "spacing");
      t.setAttribute("font-family", "Outfit, Arial, sans-serif");
      t.setAttribute("font-weight", line.weight || state.weight);
      t.setAttribute("font-size", size);
      t.setAttribute("dominant-baseline", "hanging");
      t.setAttribute("fill", state.fill);
      t.textContent = content;
      textGroup.appendChild(t);

      // Vertical: land the ink TOP exactly on targetInkTop (equal gaps).
      let b = t.getBBox();
      t.setAttribute("y", targetInkTop + (targetInkTop - b.y));

      // Horizontal: make visible ink span the column width exactly.
      b = t.getBBox();
      const leftBearing  = b.x - left;
      const rightBearing = right - (b.x + b.width);
      t.setAttribute("x", left - leftBearing);
      t.setAttribute("textLength", width + leftBearing + rightBearing);

      prevInkBottom = targetInkTop + b.height;
    });

    return prevInkBottom;
  }

  function render() {
    if (!svgEl) return;

    svgEl.querySelectorAll("g, path").forEach(node => {
      if (node.getAttribute("fill") !== null || node.tagName === "path") {
        node.setAttribute("fill", state.fill);
      }
    });

    if (framePath) {
      framePath.setAttribute("d", shiftFrameTop(frameOrigD, state.heightRegulator));
    }

    const barTop      = 11 + state.heightRegulator;     // outer top edge of frame
    const frameRight  = frameMetrics.left + frameMetrics.width;
    const baseBottom  = baseViewBox.y + baseViewBox.h;

    let minX, minY, maxX, maxY;

    if (state.mode === "side") {
      // Text column to the RIGHT of the logo. The whole text+graphics block is
      // scaled so its total height matches the logo's height exactly.
      const colLeft  = frameRight + state.textGap;
      const colWidth = frameMetrics.width;            // same width as the logo
      const regionTop    = barTop;
      const regionHeight = frameMetrics.bottom - regionTop;

      // Pass 1: natural (unscaled) height from top 0.
      const naturalH = layoutText(colLeft, colWidth, 0, 1) - 0;
      const scale = (naturalH > 0) ? regionHeight / naturalH : 1;

      // Pass 2: scaled to fill the logo height, aligned to the logo top.
      layoutText(colLeft, colWidth, regionTop, scale);

      minX = baseViewBox.x;
      maxX = colLeft + colWidth + SIDE_PAD;
      minY = Math.min(baseViewBox.y, barTop - 15);
      maxY = baseBottom;
    } else {
      // Text BELOW the logo (default).
      const textBottom = layoutText(frameMetrics.left, frameMetrics.width,
                                    frameMetrics.bottom + state.textGap);
      minX = baseViewBox.x;
      maxX = baseViewBox.x + baseViewBox.w;
      minY = Math.min(baseViewBox.y, barTop - 15);
      maxY = Math.max(baseBottom, textBottom + BOTTOM_PAD);
    }

    // Outer frame: uniform background margin around the whole composition.
    const m = state.outerMargin || 0;
    minX -= m; minY -= m; maxX += m; maxY += m;

    svgEl.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
    bgRect.setAttribute("x", minX);
    bgRect.setAttribute("y", minY);
    bgRect.setAttribute("width", maxX - minX);
    bgRect.setAttribute("height", maxY - minY);
    bgRect.setAttribute("fill", state.bg);

    els.frame.style.background = state.bg;

    persistLast();
  }

  /* =========================================================================
     UI SYNC
     ========================================================================= */
  function syncUIFromState() {
    els.fillColor.value = state.fill; els.fillHex.value = state.fill;
    els.bgColor.value = state.bg;     els.bgHex.value = state.bg;
    els.mode.value = state.mode;
    applyStageWidth();
    els.heightRegulator.value = state.heightRegulator;
    els.heightRegulatorVal.textContent =
      (state.heightRegulator > 0 ? "+" : "") + state.heightRegulator;
    els.textGap.value = state.textGap;
    els.textGapVal.textContent = state.textGap;
    els.lineSpacing.value = state.lineSpacing;
    els.lineSpacingVal.textContent = state.lineSpacing;
    els.outerMargin.value = state.outerMargin;
    els.outerMarginVal.textContent = state.outerMargin;
    els.freeSize.checked = !!state.freeSize;
    els.generalPane.classList.toggle("collapsed", !!state.generalCollapsed);
  }

  // Wider preview frame in side mode so the tall+wide artwork has room.
  function applyStageWidth() {
    els.frame.style.width = state.mode === "side"
      ? "min(92vw, 1100px)"
      : "min(70vmin, 560px)";
  }

  // Move an item from one index to another and re-render.
  function moveLine(from, to) {
    if (from === to || from < 0 || to < 0 ||
        from >= state.textLines.length || to >= state.textLines.length) return;
    const [item] = state.textLines.splice(from, 1);
    state.textLines.splice(to, 0, item);
    rebuildTextRows();
    render();
  }

  // Text-line UI. Each item is a card: header (handle • kind • title •
  // collapse • delete) + a collapsible body. Rebuilt on add/delete/load/reorder
  // (typing/sliding only updates state + preview, so focus is preserved).
  function rebuildTextRows() {
    els.textLines.innerHTML = "";
    const step = state.freeSize ? 1 : 10;
    const frameTh = frameMetrics ? Math.round(frameMetrics.thickness) : 15;

    const makeDelete = (idx) => {
      const del = document.createElement("button");
      del.className = "tl-del";
      del.title = "Delete";
      del.textContent = "×";
      del.addEventListener("click", () => {
        state.textLines.splice(idx, 1);
        if (state.textLines.length === 0)
          state.textLines.push({ type: "text", text: "", size: 60, weight: state.weight });
        rebuildTextRows();
        render();
      });
      return del;
    };

    const makeSlider = (cls, min, max, stp, val, fmt, onInput) => {
      const wrap = document.createElement("div");
      wrap.className = "size-line";
      const cap = document.createElement("span");
      cap.className = "cap"; cap.textContent = cls;
      const inp = document.createElement("input");
      inp.type = "range"; inp.className = "tl-size";
      inp.min = String(min); inp.max = String(max); inp.step = String(stp);
      inp.value = val;
      const out = document.createElement("span");
      out.className = "tl-size-val"; out.textContent = fmt(val);
      if (cls === "Weight") out.style.width = "64px";
      inp.addEventListener("input", e => {
        const v = Number(e.target.value);
        out.textContent = fmt(v);
        onInput(v);
      });
      wrap.append(cap, inp, out);
      return wrap;
    };

    state.textLines.forEach((line, idx) => {
      const isLine = line.type === "line";

      const row = document.createElement("div");
      row.className = "text-row" + (line.collapsed ? " collapsed" : "");
      row.dataset.idx = idx;

      /* ---- header ---- */
      const head = document.createElement("div");
      head.className = "tl-head";

      const handle = document.createElement("span");
      handle.className = "tl-handle";
      handle.textContent = "⠿";
      handle.title = "Drag to reorder";

      const kind = document.createElement("span");
      kind.className = "tl-kind" + (isLine ? " is-line" : "");
      kind.textContent = isLine ? "Line" : "Text";

      const title = document.createElement("span");
      title.className = "tl-title";
      if (isLine) {
        title.textContent = "Horizontal line";
      } else if ((line.text || "").trim()) {
        title.textContent = line.text;
      } else {
        title.textContent = "(empty text)";
        title.classList.add("empty");
      }

      const collapse = document.createElement("button");
      collapse.className = "tl-collapse";
      collapse.title = "Collapse / expand";
      collapse.textContent = "▼";
      collapse.addEventListener("click", () => {
        line.collapsed = !line.collapsed;
        row.classList.toggle("collapsed", !!line.collapsed);
        persistLast();
      });

      head.append(handle, kind, title, collapse, makeDelete(idx));
      row.append(head);

      /* ---- body ---- */
      const body = document.createElement("div");
      body.className = "tl-body";

      if (isLine) {
        const thNow = (line.thickness == null) ? frameTh : Math.round(line.thickness);
        body.append(makeSlider("Thickness", 1, frameTh * 2, 1, thNow, v => v, v => {
          state.textLines[idx].thickness = v; render();
        }));
      } else {
        const textInput = document.createElement("input");
        textInput.type = "text";
        textInput.className = "tl-text";
        textInput.value = line.text;
        textInput.placeholder = "LINE TEXT";
        textInput.spellcheck = false;
        textInput.addEventListener("input", e => {
          state.textLines[idx].text = e.target.value;
          title.textContent = e.target.value.trim() || "(empty text)";
          title.classList.toggle("empty", !e.target.value.trim());
          render();
        });
        body.append(textInput);

        body.append(makeSlider("Size", 20, 200, step, line.size, v => v, v => {
          state.textLines[idx].size = v; render();
        }));

        const w = line.weight || state.weight;
        body.append(makeSlider("Weight", 100, 900, 100, w,
          v => WEIGHT_NAMES[v], v => { state.textLines[idx].weight = v; render(); }));
      }

      row.append(body);

      /* ---- drag & drop reordering (whole card draggable via handle) ---- */
      handle.addEventListener("mousedown", () => { row.draggable = true; });
      row.addEventListener("dragend", () => { row.draggable = false; });
      handle.addEventListener("touchstart", () => { row.draggable = true; }, { passive: true });

      row.addEventListener("dragstart", e => {
        dragFromIdx = idx;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", String(idx)); } catch (_) {}
      });
      row.addEventListener("dragover", e => {
        e.preventDefault();
        const after = (e.clientY - row.getBoundingClientRect().top) > row.offsetHeight / 2;
        row.classList.toggle("drop-after", after);
        row.classList.toggle("drop-before", !after);
      });
      row.addEventListener("dragleave", () => {
        row.classList.remove("drop-before", "drop-after");
      });
      row.addEventListener("drop", e => {
        e.preventDefault();
        const after = row.classList.contains("drop-after");
        row.classList.remove("drop-before", "drop-after");
        let to = idx + (after ? 1 : 0);
        if (dragFromIdx < to) to -= 1;   // account for the removed source item
        moveLine(dragFromIdx, to);
      });

      els.textLines.appendChild(row);
    });
  }
  let dragFromIdx = -1;

  function normalizeHex(v) {
    v = v.trim();
    if (!v.startsWith("#")) v = "#" + v;
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : null;
  }

  /* =========================================================================
     EVENT WIRING
     ========================================================================= */
  els.fillColor.addEventListener("input", e => {
    state.fill = e.target.value; els.fillHex.value = state.fill; render();
  });
  els.fillHex.addEventListener("change", e => {
    const hex = normalizeHex(e.target.value);
    if (hex) { state.fill = hex; els.fillColor.value = hex; els.fillHex.value = hex; render(); }
    else { els.fillHex.value = state.fill; }
  });

  els.bgColor.addEventListener("input", e => {
    state.bg = e.target.value; els.bgHex.value = state.bg; render();
  });
  els.bgHex.addEventListener("change", e => {
    const hex = normalizeHex(e.target.value);
    if (hex) { state.bg = hex; els.bgColor.value = hex; els.bgHex.value = hex; render(); }
    else { els.bgHex.value = state.bg; }
  });

  els.mode.addEventListener("change", e => {
    state.mode = e.target.value;
    applyStageWidth();
    render();
  });

  els.heightRegulator.addEventListener("input", e => {
    state.heightRegulator = Number(e.target.value);
    els.heightRegulatorVal.textContent =
      (state.heightRegulator > 0 ? "+" : "") + state.heightRegulator;
    render();
  });

  els.textGap.addEventListener("input", e => {
    state.textGap = Number(e.target.value);
    els.textGapVal.textContent = state.textGap;
    render();
  });

  els.outerMargin.addEventListener("input", e => {
    state.outerMargin = Number(e.target.value);
    els.outerMarginVal.textContent = state.outerMargin;
    render();
  });

  els.generalPaneHead.addEventListener("click", () => {
    state.generalCollapsed = !state.generalCollapsed;
    els.generalPane.classList.toggle("collapsed", state.generalCollapsed);
    persistLast();
  });

  els.lineSpacing.addEventListener("input", e => {
    state.lineSpacing = Number(e.target.value);
    els.lineSpacingVal.textContent = state.lineSpacing;
    render();
  });

  els.freeSize.addEventListener("change", e => {
    state.freeSize = e.target.checked;
    rebuildTextRows();   // updates each size slider's step
    render();
  });

  els.addLine.addEventListener("click", () => {
    state.textLines.push({ type: "text", text: "", size: 60, weight: state.weight });
    rebuildTextRows();
    render();
  });

  els.addRule.addEventListener("click", () => {
    state.textLines.push({ type: "line", thickness: null });
    rebuildTextRows();
    render();
  });

  els.swap.addEventListener("click", () => {
    [state.fill, state.bg] = [state.bg, state.fill];
    els.fillColor.value = state.fill; els.fillHex.value = state.fill;
    els.bgColor.value = state.bg;     els.bgHex.value = state.bg;
    render();
  });

  els.reset.addEventListener("click", () => {
    for (const k of RESET_KEYS) state[k] = structuredClone(DEFAULTS[k]);
    syncUIFromState();
    rebuildTextRows();
    render();
  });

  // ---- Saved setups ----
  els.saveSetup.addEventListener("click", () => {
    const name = els.setupName.value.trim();
    if (!name) { els.setupName.focus(); return; }
    const db = loadDB();
    db.setups = db.setups || {};
    db.setups[name] = structuredClone(state);
    saveDB(db);
    els.setupName.value = "";
    refreshSetupList(name);
  });

  els.loadSetup.addEventListener("click", () => {
    const name = els.setupSelect.value;
    const db = loadDB();
    if (name && db.setups && db.setups[name]) {
      adoptState(db.setups[name]);
    } else if (db.last) {
      adoptState(db.last);
    }
    syncUIFromState();
    rebuildTextRows();
    render();
  });

  els.deleteSetup.addEventListener("click", () => {
    const name = els.setupSelect.value;
    if (!name) return;
    const db = loadDB();
    if (db.setups && db.setups[name]) {
      delete db.setups[name];
      saveDB(db);
      refreshSetupList();
    }
  });
</script>
</body>
</html>
